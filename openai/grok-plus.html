<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyromance’s Cosmic Pentad: From Carnival to Heaven</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: radial-gradient(circle at 30% 20%, #1a0626 0%, #0a0a0a 40%, #000000 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            cursor: crosshair;
        }
        
        .cosmos {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pentad-container {
            position: relative;
            width: 65vmin;
            height: 65vmin;
            transform-style: preserve-3d;
            animation: kosmicSpin 180s linear infinite;
        }
        
        .glyph {
            position: absolute;
            width: 9vmin;
            height: 9vmin;
            font-size: 4.5vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 70%);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
            transform-origin: center;
        }
        
        .glyph::before {
            content: '';
            position: absolute;
            width: 120%;
            height: 120%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, transparent 0%, rgba(255, 255, 255, 0.08) 100%);
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: -1;
        }
        
        .glyph:hover::before,
        .glyph.active::before {
            opacity: 1;
        }
        
        .glyph:hover,
        .glyph.active {
            transform: scale(1.3) rotateY(15deg);
            box-shadow: 0 0 80px var(--glow-color);
            border: 3px solid var(--glow-color);
        }
        
        /* Pentagon vertices - mapping the spiral */
        .glyph:nth-child(1) { /* 🎭 Zungu - Carnival/Theater - Top */
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            --glow-color: #FF6B35;
        }
        
        .glyph:nth-child(2) { /* 🔗 Zunga - Binding/Connection - Top Right */
            top: 25%;
            right: 8%;
            --glow-color: #F7931E;
        }
        
        .glyph:nth-child(3) { /* 🌊 Zula - Seeking/Wandering - Bottom Right */
            bottom: 25%;
            right: 18%;
            --glow-color: #4FC3F7;
        }
        
        .glyph:nth-child(4) { /* ⚡ Zukuka - Awakening/Rising - Bottom Left */
            bottom: 25%;
            left: 18%;
            --glow-color: #FFD700;
        }
        
        .glyph:nth-child(5) { /* 🌌 Zunguka→Zulu/Gulu - Orbit→Heaven - Top Left */
            top: 25%;
            left: 8%;
            --glow-color: #9C27B0;
        }
        
        .glyph:hover,
        .glyph.active {
            box-shadow: 0 0 80px var(--glow-color);
            border: 3px solid var(--glow-color);
        }
        
        .detail-panel {
            position: fixed;
            right: -42vw;
            top: 0;
            width: 42vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(25px);
            border-left: 2px solid rgba(255, 255, 255, 0.15);
            transition: right 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow-y: auto;
            padding: 3rem;
            z-index: 1000;
        }
        
        .detail-panel.open {
            right: 0;
        }
        
        .detail-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .detail-glyph {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 30px var(--detail-glow));
        }
        
        .detail-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--detail-glow);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .detail-content {
            line-height: 1.7;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
        }
        
        .detail-section {
            margin-bottom: 2.5rem;
        }
        
        .detail-section h3 {
            color: var(--detail-glow);
            margin-bottom: 1.2rem;
            font-size: 1.15rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .detail-section p {
            margin-bottom: 1.2rem;
        }
        
        .bantu-phrase {
            font-style: italic;
            color: var(--detail-glow);
            font-weight: 500;
        }
        
        .close-btn {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s ease;
            font-size: 1.4rem;
            font-weight: 300;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.15) rotate(90deg);
        }
        
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: cosmicTwinkle 4s infinite;
        }
        
        .shooting-star {
            position: absolute;
            width: 4px;
            height: 2px;
            background: linear-gradient(45deg, transparent, #FFD700, transparent);
            animation: shoot 8s linear infinite;
        }
        
        @keyframes kosmicSpin {
            0% { transform: rotateZ(0deg) rotateY(0deg); }
            50% { transform: rotateZ(180deg) rotateY(10deg); }
            100% { transform: rotateZ(360deg) rotateY(0deg); }
        }
        
        @keyframes cosmicTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            25% { opacity: 0.8; transform: scale(1.2); }
            50% { opacity: 1; transform: scale(1.5); }
            75% { opacity: 0.6; transform: scale(1.1); }
        }
        
        @keyframes shoot {
            0% { 
                left: -100px; 
                top: 20%; 
                opacity: 0; 
            }
            10% { opacity: 1; }
            90% { opacity: 0.5; }
            100% { 
                left: 100vw; 
                top: 80%; 
                opacity: 0; 
            }
        }
        
        .title-overlay {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            z-index: 10;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            margin-top: 0.5rem;
            color: rgba(255, 255, 255, 0.5);
        }
        
        @media (max-width: 768px) {
            .detail-panel {
                right: -100vw;
                width: 100vw;
                padding: 2rem;
            }
            
            .pentad-container {
                width: 85vmin;
                height: 85vmin;
            }
            
            .glyph {
                width: 12vmin;
                height: 12vmin;
                font-size: 6vmin;
            }
        }
    </style>
</head>

        // Generate enhanced cosmic environment
        function generateCosmicEnvironment() {
            const starsContainer = document.getElementById('stars');
            
            // Regular stars
            for (let i = 0; i < 300; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 4 + 's';
                star.style.animationDuration = (3 + Math.random() * 2) + 's';
                starsContainer.appendChild(star);
            }
            
            // Shooting stars
            for (let i = 0; i < 3; i++) {
                const shootingStar = document.createElement('div');
                shootingStar.className = 'shooting-star';
                shootingStar.style.animationDelay = Math.random() * 8 + 's';
                shootingStar.style.animationDuration = (6 + Math.random() * 4) + 's';
                starsContainer.appendChild(shootingStar);
            }
        }
        
        // Handle glyph interactions
        function showDetail(glyphType) {
            const data = zunguData[glyphType];
            const panel = document.getElementById('detailPanel');
            const glyph = document.getElementById('detailGlyph');
            const title = document.getElementById('detailTitle');
            const content = document.getElementById('detailContent');
            
            // Update content
            glyph.textContent = data.glyph;
            title.textContent = data.title;
            content.innerHTML = data.content;
            
            // Update colors
            document.documentElement.style.setProperty('--detail-glow', data.color);
            
            // Show panel
            panel.classList.add('open');
            
            // Update active state
            document.querySelectorAll('.glyph').forEach(g => g.classList.remove('active'));
            document.querySelector(`[data-glyph="${glyphType}"]`).classList.add('active');
        }
        
        function closeDetail() {
            const panel = document.getElementById('detailPanel');
            panel.classList.remove('open');
            document.querySelectorAll('.glyph').forEach(g => g.classList.remove('active'));
        }
        
        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            generateCosmicEnvironment();
            
            // Add click/touch handlers for glyphs
            document.querySelectorAll('.glyph').forEach(glyph => {
                glyph.addEventListener('click', function() {
                    const glyphType = this.getAttribute('data-glyph');
                    showDetail(glyphType);
                });
                
                // Touch events for mobile
                glyph.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    const glyphType = this.getAttribute('data-glyph');
                    showDetail(glyphType);
                });
            });
            
            // Close panel on escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeDetail();
                }
            });
            
            // Close panel on background click
            document.addEventListener('click', function(e) {
                if (e.target === document.body || e.target.classList.contains('cosmos')) {
                    closeDetail();
                }
            });
        });
